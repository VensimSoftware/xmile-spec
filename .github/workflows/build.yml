name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The schema is XSD 1.1, which no Node validator implements. See
      # tools/validate.py.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - run: python -m pip install -r tools/requirements.txt

      # Rejects a "Section 6.4.2" typed as plain text, which nothing could
      # validate. Every reference must be an <<anchor>>.
      - name: Lint cross-references
        run: npm run lint

      # Warnings are fatal, so a reference to a deleted section fails here.
      - name: Build specification
        run: npm run build

      # With no documents this compiles the schema and stops, so an edit that
      # breaks it fails here rather than in someone else's validator.
      - name: Validate schema
        run: npm run validate

      # The sample documents beside the schema are only worth having if they
      # validate against it. Without this step nothing reads them, which is how
      # WithArrays.xmile came to be committed with an unterminated tag.
      #
      # This is red today, for two reasons, and is worth keeping red as the
      # tracker for both:
      #   - <ai_information> and ai_state="..." are a proposed addition to the
      #     standard that the schema does not yet declare.
      #   - WithArrays.xmile writes <uses_arrays/> bare. Section 2 calls the
      #     attribute maximum_dimensions and REQUIRED, the schema calls it
      #     max_dimensions and required, and no file anywhere writes either.
      - name: Validate sample documents
        run: npm run validate -- "spec/schema/*.xmile"

      - uses: actions/upload-artifact@v4
        with:
          name: xmile-spec-html
          path: build/
